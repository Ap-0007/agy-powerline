name: Branch policy

# main only receives the maintainer's PRs from develop. Contributions go to
# develop. Make the "main accepts develop only" check required on main
# (see TODO.md) so GitHub blocks merging anything else.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    name: main accepts develop only
    runs-on: ubuntu-latest
    steps:
      # PR metadata is untrusted input: read it through env vars, never
      # interpolate it into the script.
      - name: Check source branch and author
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ] || [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Pull requests into main must come from the develop branch of $REPO. Please retarget this PR to develop."
            exit 1
          fi
          if [ "$AUTHOR" != "$OWNER" ]; then
            echo "::error::Only $OWNER can open pull requests into main. Please target develop instead."
            exit 1
          fi
          echo "OK: $AUTHOR is merging develop into main."
